name: 定時圖片抓取 (08:00/13:20/19:50)

on:
  schedule:
    # 台灣時間 07:00 (UTC 23:00 前一天)
    - cron: '0 23 * * *'
    # 台灣時間 12:20 (UTC 04:20)
    - cron: '20 4 * * *'
    # 台灣時間 23:00 (UTC 15:00)
    - cron: '0 15 * * *'
  workflow_dispatch: # 允許手動觸發

permissions:
  contents: write  # 允許寫入內容和推送

jobs:
  scheduled-scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: 設定 Chrome 和 ChromeDriver
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable
        
    - name: 驗證 Chrome 安裝
      run: |
        google-chrome --version
        which chromedriver || echo "ChromeDriver 路徑檢查..."
        
        # 如果 chromedriver 不在 PATH 中，嘗試尋找並連結
        if ! which chromedriver; then
          echo "尋找 ChromeDriver..."
          CHROMEDRIVER_PATH=$(find /opt /usr -name "chromedriver" 2>/dev/null | head -1)
          if [ -n "$CHROMEDRIVER_PATH" ]; then
            echo "找到 ChromeDriver: $CHROMEDRIVER_PATH"
            sudo ln -sf "$CHROMEDRIVER_PATH" /usr/local/bin/chromedriver
          else
            echo "手動安裝 ChromeDriver..."
            # 使用最新穩定版本
            LATEST_VERSION=$(curl -s "https://chromedriver.storage.googleapis.com/LATEST_RELEASE")
            wget -O /tmp/chromedriver.zip "https://chromedriver.storage.googleapis.com/$LATEST_VERSION/chromedriver_linux64.zip"
            cd /tmp && unzip chromedriver.zip
            sudo mv chromedriver /usr/local/bin/
            sudo chmod +x /usr/local/bin/chromedriver
          fi
        fi
        
        chromedriver --version
        
    - name: 安裝 Python 依賴
      run: |
        pip install selenium requests pillow
        
    - name: 創建設定檔
      run: |
        cat > scripts/config.json << EOF
        {
          "images_directory": "../images",
          "colne_icol_directory": "../colne_icol_images",
          "line_bot": {
            "github_pages_base": "https://future801113.github.io/i-love-col"
          }
        }
        EOF
        
    - name: 設定環境變數
      run: |
        echo "LINE_CHANNEL_ACCESS_TOKEN=${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" >> $GITHUB_ENV
        echo "LINE_TARGET_ID=${{ secrets.LINE_TARGET_ID }}" >> $GITHUB_ENV
        
    - name: 執行每日圖片抓取 (不發送 LINE)
      run: |
        cd scripts
        echo "🚀 開始執行每日圖片抓取..."
        echo "當前工作目錄: $(pwd)"
        echo "目錄內容:"
        ls -la
        echo "環境變數檢查:"
        echo "LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:0:20}..." 
        echo "LINE_TARGET_ID: $LINE_TARGET_ID"
        
        # 暫時禁用 LINE 發送，先專注於圖片抓取和組合
        export SKIP_LINE_SEND=true
        python web_scraper_simple.py daily
        
        echo "執行後目錄變化:"
        ls -la ../images/ || echo "images 目錄不存在"
        ls -la ../colne_icol_images/ || echo "colne_icol_images 目錄不存在"
        ls -la ../combined_images/ || echo "combined_images 目錄不存在"
        
        # 驗證 .scrape_status 文件是否被創建
        echo "驗證狀態文件:"
        if [ -f .scrape_status ]; then
          echo "✅ .scrape_status 文件已建立"
          cat .scrape_status
        else
          echo "⚠️ .scrape_status 文件不存在，建立預設狀態"
          echo "HAS_NEW_IMAGES=false" > .scrape_status
          cat .scrape_status
        fi
        
    - name: 檢查變更並提交
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 先同步遠端變更
        echo "🔄 同步遠端變更..."
        git fetch origin
        git pull --rebase origin master || true
        
        # 檢查是否有變更
        if [ -n "$(git status --porcelain)" ]; then
          echo "✅ 有變更需要提交"
          
          # 顯示變更統計
          echo "📊 變更統計:"
          git status --porcelain | wc -l
          echo "📝 變更詳情:"
          git status --porcelain
          
          # 統計各目錄的圖片數量
          if [ -d images ]; then
            echo "📸 ice_deliverer 圖片總數: $(find images -name "*.jpg" -o -name "*.png" | wc -l)"
          fi
          if [ -d colne_icol_images ]; then
            echo "📸 colne_icol 圖片總數: $(find colne_icol_images -name "*.jpg" -o -name "*.png" | wc -l)"
          fi
          if [ -d combined_images ]; then
            echo "🎨 組合圖片總數: $(find combined_images -name "*.jpg" -o -name "*.png" | wc -l)"
          fi
          
          # 添加所有變更
          git add .
          
          # 提交變更
          git commit -m "🤖 定時自動抓取圖片 - $(date '+%Y-%m-%d %H:%M:%S')"
          
          # 推送變更
          echo "📤 推送變更到遠端..."
          git push origin master
          echo "✅ 推送完成"
        else
          echo "📰 沒有變更需要提交"
        fi
        
    - name: 等待 GitHub Pages 部署
      if: success()
      run: |
        echo "⏳ 等待 GitHub Pages 部署完成..."
        echo "等待 90 秒讓 GitHub Pages 更新..."
        sleep 90
        
    - name: 發送組合圖片到 LINE 群組
      if: success()
      run: |
        cd scripts
        echo "📱 開始發送組合圖片到 LINE 群組..."
        
        # 調試：顯示當前目錄和文件
        echo "🔍 調試信息："
        echo "   當前目錄: $(pwd)"
        echo "   .scrape_status 文件狀態:"
        if [ -f .scrape_status ]; then
          echo "   ✅ 文件存在"
          ls -lh .scrape_status
          echo "   📄 文件內容:"
          cat .scrape_status
        else
          echo "   ❌ 文件不存在"
          ls -la | grep -E "scrape|status" || echo "   沒有找到相關文件"
        fi
        
        # 先讀取抓圖狀態
        HAS_NEW_IMAGES="false"
        COMBINED_IMAGE_PATH=""
        BACKUP_IMAGE_PATH=""
        HAS_IMAGE_TO_SEND="false"
        
        if [ -f .scrape_status ]; then
          echo "📖 讀取抓圖狀態..."
          source .scrape_status
          echo "HAS_NEW_IMAGES: $HAS_NEW_IMAGES"
          echo "COMBINED_IMAGE_PATH: $COMBINED_IMAGE_PATH"
          echo "BACKUP_IMAGE_PATH: $BACKUP_IMAGE_PATH"
          echo "HAS_IMAGE_TO_SEND: $HAS_IMAGE_TO_SEND"
        else
          echo "⚠️ 找不到抓圖狀態文件"
        fi
        
        # 根據有無圖片決定是否發送
        if [ "$HAS_IMAGE_TO_SEND" = "true" ]; then
          # 優先使用組合圖片，其次備用圖片
          IMAGE_TO_SEND=""
          IMAGE_TYPE=""
          
          if [ -n "$COMBINED_IMAGE_PATH" ] && [ -f "$COMBINED_IMAGE_PATH" ]; then
            IMAGE_TO_SEND="$COMBINED_IMAGE_PATH"
            IMAGE_TYPE="新組合圖片"
          elif [ -n "$BACKUP_IMAGE_PATH" ] && [ -f "$BACKUP_IMAGE_PATH" ]; then
            IMAGE_TO_SEND="$BACKUP_IMAGE_PATH"
            IMAGE_TYPE="備用組合圖片"
          fi
          
          if [ -n "$IMAGE_TO_SEND" ]; then
            echo "✅ 找到可發送的圖片: $IMAGE_TYPE"
            FILENAME=$(basename "$IMAGE_TO_SEND")
            IMAGE_URL="https://future801113.github.io/i-love-col/combined_images/$FILENAME"
            
            echo "🖼️ 圖片路徑: $IMAGE_TO_SEND"
            echo "🔗 圖片 URL: $IMAGE_URL"
            
            # 測試 URL 是否可訪問
            echo "🧪 測試圖片 URL 可用性..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$IMAGE_URL")
            echo "HTTP 狀態碼: $HTTP_STATUS"
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ 圖片 URL 可訪問"
              
              # 使用獨立的 Python 腳本發送 LINE 訊息
              python3 send_line_image.py "$IMAGE_URL"
              
            else
              echo "⏳ 圖片 URL 尚未可訪問，再等待 60 秒後重試..."
              sleep 60
              
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$IMAGE_URL")
              if [ "$HTTP_STATUS" = "200" ]; then
                echo "✅ 重試成功，圖片 URL 現在可訪問"
                python3 send_line_image.py "$IMAGE_URL"
              else
                echo "❌ 圖片 URL 仍然無法訪問，跳過 LINE 發送"
              fi
            fi
          else
            echo "❌ 圖片路徑無效或文件不存在"
          fi
        else
          echo "⏭️ 沒有可發送的圖片 (HAS_IMAGE_TO_SEND=$HAS_IMAGE_TO_SEND)"
        fi
        
    - name: 顯示執行結果統計
      if: always()
      run: |
        echo "📊 執行結果統計:"
        if [ -d images ]; then
          echo "📸 ice_deliverer 圖片總數: $(find images -name "*.jpg" -o -name "*.png" | wc -l)"
          echo "📸 ice_deliverer 最新圖片:"
          find images -name "*.jpg" -o -name "*.png" | sort -r | head -5
        fi
        if [ -d colne_icol_images ]; then
          echo "📸 colne_icol 圖片總數: $(find colne_icol_images -name "*.jpg" -o -name "*.png" | wc -l)"
          echo "📸 colne_icol 最新圖片:"
          find colne_icol_images -name "*.jpg" -o -name "*.png" | sort -r | head -5
        fi
        if [ -d combined_images ]; then
          echo "🎨 組合圖片總數: $(find combined_images -name "*.jpg" -o -name "*.png" | wc -l)"
          echo "🎨 最新組合圖片:"
          find combined_images -name "*.jpg" -o -name "*.png" | sort -r | head -3
        fi
